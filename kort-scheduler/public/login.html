<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Планировщик WhatsApp</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1a1d21; --muted: #667085; --border: #e3e7ec;
    --accent: #1f8a4c; --accent-hover: #176d3b; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111417; --card: #1b1f24; --text: #e8ebef; --muted: #98a2b3; --border: #2b323a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 100%; max-width: 360px; }
  h1 { font-size: 18px; margin: 0 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 4px; }
  input, select, button { font: inherit; }
  input[type=email], input[type=password] {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  #langSwitch { width: auto; padding: 4px 6px; font-size: 12px; }
  button {
    width: 100%; margin-top: 18px; padding: 10px 16px; border-radius: 8px; border: 1px solid transparent;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<main class="card">
  <h1>
    <span data-i18n="title">Вход</span>
    <select id="langSwitch" aria-label="Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </h1>
  <form id="form">
    <label for="email" data-i18n="emailLabel">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password" data-i18n="passwordLabel">Пароль</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button type="submit" id="submit" data-i18n="submitBtn">Войти</button>
    <p class="error" id="formError"></p>
  </form>
</main>
<script>
const TRANSLATIONS = {
  ru: {
    title: 'Вход',
    emailLabel: 'Email',
    passwordLabel: 'Пароль',
    submitBtn: 'Войти',
    errRequired: 'Введите email и пароль.',
    errInvalid: 'Неверный email или пароль.',
    errGeneric: 'Не удалось войти. Попробуйте ещё раз.',
  },
  en: {
    title: 'Sign in',
    emailLabel: 'Email',
    passwordLabel: 'Password',
    submitBtn: 'Sign in',
    errRequired: 'Enter email and password.',
    errInvalid: 'Invalid email or password.',
    errGeneric: 'Could not sign in. Please try again.',
  },
}
const SERVER_ERROR_KEYS = {
  'Email and password are required.': 'errRequired',
  'Invalid email or password.': 'errInvalid',
}

let lang = localStorage.getItem('lang') || 'ru'
if (!TRANSLATIONS[lang]) lang = 'ru'

const $ = (id) => document.getElementById(id)

function t(key) {
  return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) ?? TRANSLATIONS.ru[key] ?? key
}

function applyTranslations() {
  document.documentElement.lang = lang
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n) })
  $('langSwitch').value = lang
}

$('langSwitch').addEventListener('change', (e) => {
  lang = TRANSLATIONS[e.target.value] ? e.target.value : 'ru'
  localStorage.setItem('lang', lang)
  applyTranslations()
})

$('form').addEventListener('submit', async (e) => {
  e.preventDefault()
  const errEl = $('formError')
  const submitBtn = $('submit')
  errEl.textContent = ''
  submitBtn.disabled = true
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, password: $('password').value }),
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok) {
      const key = SERVER_ERROR_KEYS[data.error]
      errEl.textContent = key ? t(key) : (data.error || t('errGeneric'))
      return
    }
    window.location.href = '/'
  } catch {
    errEl.textContent = t('errGeneric')
  } finally {
    submitBtn.disabled = false
  }
})

applyTranslations()
</script>
</body>
</html>
